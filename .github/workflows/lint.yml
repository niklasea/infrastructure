---
name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/linters/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.63.1

      - name: Install linters
        run: | # zizmor: ignore[adhoc-packages]
          python -m pip install -r .github/linters/requirements.txt
          npm install --global markdownlint-cli@0.49.1

          mkdir -p "$HOME/.local/bin"
          curl --retry 3 --retry-delay 2 -fsSL \
            -o "$HOME/.local/bin/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          chmod +x "$HOME/.local/bin/hadolint"
          curl --retry 3 --retry-delay 2 -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Initialize TFLint plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init -c .github/linters/.tflint.hcl

      - parallel:
          - name: Lint Ansible
            working-directory: ansible
            run: ansible-lint -c ../.github/linters/.ansible-lint.yml

          - name: Lint Checkov
            run: checkov --config-file .github/linters/.checkov.yaml --directory .

          - name: Lint Dockerfiles
            run: |
              mapfile -t files < <(git ls-files | grep -iE '(^|/)([^/]*\.)?(contain|dock)erfile$')
              if [ ${#files[@]} -eq 0 ]; then
                echo "No Dockerfiles found"
                exit 0
              fi
              hadolint -c .github/linters/.hadolint.yaml "${files[@]}"

          - name: Lint GitHub Actions workflows
            run: actionlint -config-file .github/linters/actionlint.yml .github/workflows/*.yml

          - name: Audit GitHub Actions workflows
            run: zizmor --config .github/linters/zizmor.yaml .github/workflows

          - name: Lint Markdown
            run: |
              mapfile -t files < <(git ls-files '*.md')
              markdownlint -c .github/linters/.markdown-lint.yml "${files[@]}"

          - name: Lint Terraform
            working-directory: terraform
            env:
              TF_DATA_DIR: /tmp/tflint-terraform
            run: tflint -c ../.github/linters/.tflint.hcl

          - name: Lint YAML
            run: |
              mapfile -t files < <(git ls-files '*.yml' '*.yaml')
              yamllint -c .github/linters/.yaml-lint.yml -f parsable "${files[@]}"

          - name: Check for merge conflict markers
            shell: bash
            run: |
              status=0
              while IFS= read -r -d '' file; do
                if grep -qE '^<{7} .+$' "$file" &&
                   grep -qE '^={7}$' "$file" &&
                   grep -qE '^>{7} .+$' "$file"; then
                  echo "Found Git merge conflict markers: $file"
                  status=1
                fi
              done < <(git ls-files -z)
              exit "$status"

  validate_terraform:
    name: Validate Terraform configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -input=false -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

  validate_ansible:
    name: Validate Ansible configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./ansible

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Ansible syntax check
        run: ansible-playbook --syntax-check main.yml
