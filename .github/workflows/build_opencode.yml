---
name: Build OpenCode image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build_opencode.yml
      - ansible/dockerfiles/opencode/**
  pull_request:
    paths:
      - .github/workflows/build_opencode.yml
      - ansible/dockerfiles/opencode/**

jobs:
  build:
    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/push_docker_image.yml
    with:
      image_name: ghcr.io/niklasea/opencode
      context: ansible/dockerfiles/opencode
      file: ansible/dockerfiles/opencode/dockerfile
