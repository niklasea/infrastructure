---
name: Build OpenCode image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build_opencode.yml
      - ansible/dockerfiles/opencode/**
  pull_request:
    paths:
      - .github/workflows/build_opencode.yml
      - ansible/dockerfiles/opencode/**
  schedule:
    # Weekly rebuild from the latest OpenCode V2 release.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      opencode_base_tag:
        description: "OpenCode V2 base image tag (defaults to 2.4.1)"
        required: false
        default: ""
        type: string

jobs:
  resolve:
    name: Resolve OpenCode V2 base
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          OPENCODE_BASE_TAG: ${{ inputs.opencode_base_tag }}
        run: |
          version="${OPENCODE_BASE_TAG}"
          if [ -z "$version" ]; then
            version="$(python3 .github/scripts/resolve-opencode-version.py)"
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/push_docker_image.yml
    with:
      image_name: ghcr.io/niklasea/opencode
      context: ansible/dockerfiles/opencode
      file: ansible/dockerfiles/opencode/dockerfile
      build-args: "OPENCODE_BASE_VERSION=${{ needs.resolve.outputs.version }}"
      push_latest: "${{ github.event_name != 'workflow_dispatch' || inputs.opencode_base_tag == '' }}"

  tag-version:
    name: Tag image with upstream version
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name != 'workflow_dispatch' || inputs.opencode_base_tag == '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the latest image with the OpenCode version
        run: |
          set -euo pipefail
          image=ghcr.io/niklasea/opencode:latest
          docker pull "$image"
          output="$(docker run --rm --network none --entrypoint opencode "$image" --version)"
          version="$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' <<< "$output")"
          test -n "$version"
          docker buildx imagetools create \
            --tag "ghcr.io/niklasea/opencode:${version}" \
            "$image"
