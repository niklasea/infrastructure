---
name: Build OpenCode image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build_opencode.yml
      - ansible/dockerfiles/opencode/**
  pull_request:
    paths:
      - .github/workflows/build_opencode.yml
      - ansible/dockerfiles/opencode/**
  schedule:
    # Weekly rebuild to pick up the latest stable OpenCode base image.
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/push_docker_image.yml
    with:
      image_name: ghcr.io/niklasea/opencode
      context: ansible/dockerfiles/opencode
      file: ansible/dockerfiles/opencode/dockerfile

  tag-version:
    name: Tag image with upstream version
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the latest image with the OpenCode version
        run: |
          image=ghcr.io/niklasea/opencode:latest
          docker pull "$image"
          version="$(docker run --rm --entrypoint opencode "$image" --version \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          test -n "$version"
          docker tag "$image" "ghcr.io/niklasea/opencode:${version}"
          docker push "ghcr.io/niklasea/opencode:${version}"
