---
- name: Build static routes
  ansible.builtin.set_fact:
    vyos_static_routes: >-
      {{ vyos_static_routes | default([])
         + [{'network': item, 'gateway': vpn_network_ipv4['local_address']}] }}
  loop: "{{ [vpn_network_ipv4['network']] + vpn_network_ipv4['peer_networks'] }}"

- name: Get checksum of the configuration script on the router
  ansible.builtin.raw: "sha256sum {{ vyos_script_remote_path }} 2>/dev/null || true"
  changed_when: false
  failed_when: false
  register: _vyos_configuration_script_checksum

- name: Upload configuration script
  ansible.builtin.raw: >-
    printf '%s' '{{ _vyos_configuration_script | b64encode }}'
    | base64 -d > {{ vyos_script_remote_path }} &&
    chmod 700 {{ vyos_script_remote_path }}
  vars:
    _vyos_configuration_script: >-
      {{ lookup('ansible.builtin.template', 'commands.sh.j2') }}
  when: >-
    _vyos_configuration_script_checksum.stdout.split() | first | default('') !=
    (_vyos_configuration_script | hash('sha256'))
  register: _vyos_configuration_script_upload

- name: Apply configuration
  when: _vyos_configuration_script_upload is changed
  block:
    # Run commands and say yes to any prompts.
    - name: Run script
      ansible.builtin.raw: |
        set -o pipefail
        yes | ./{{ vyos_script_remote_path }}
      args:
        executable: /bin/vbash
      register: _vyos_commands_result
      failed_when: "'Commit failed' in _vyos_commands_result.stdout"

    - name: Save changes
      ansible.builtin.raw: |
        source /opt/vyatta/etc/functions/script-template
        configure
        confirm
        save
      args:
        executable: /bin/vbash
      register: _vyos_save_result
      failed_when: >-
        _vyos_save_result.rc != 0 or
        'No confirm pending' in _vyos_save_result.stdout
  rescue:
    - name: Delete configuration script to force a retry next time
      ansible.builtin.raw: "rm -f {{ vyos_script_remote_path }}"
      failed_when: false

    - name: Fail the deployment
      ansible.builtin.fail:
        msg: VyOS configuration failed!
