---
- name: OS-specific configuration
  ansible.builtin.include_tasks:
    file: "{{ ansible_facts['os_family'] }}.yml"
    apply:
      become: true

- name: Enable IP forwarding
  become: true
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-netbird-forwarding.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: net.ipv4.ip_forward, value: '1' }
    - { name: net.ipv6.conf.all.forwarding, value: '1' }

- name: Ensure systemd-resolved is installed
  become: true
  when: netbird_peer_ensure_systemd_resolved
  ansible.builtin.package:
    name: systemd-resolved
    state: present

- name: Ensure systemd-resolved is running
  become: true
  when: netbird_peer_ensure_systemd_resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: true
    state: started

- name: Start Netbird
  become: true
  ansible.builtin.command:
    cmd: >
      netbird up
      --setup-key {{ netbird_peer_setup_key }}
      --management-url {{ 'https://%s/' | ansible.builtin.format(netbird_peer_domain) | ansible.builtin.quote }}
      --disable-dns={{ netbird_peer_disable_dns | lower }}
      --dns-resolver-address {{ netbird_peer_dns_resolver_address | ansible.builtin.quote }}
  no_log: true
  register: _netbird_peer_start
  changed_when: "'Already connected' not in _netbird_peer_start.stdout"
