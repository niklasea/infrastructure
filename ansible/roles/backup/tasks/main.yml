---
- name: Install backup scripts
  become: true
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "/usr/local/sbin/backup-{{ item.name }}.sh"
    owner: root
    group: root
    mode: '0700'
    validate: "/usr/bin/bash -n %s"
  loop: "{{ backup_jobs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Schedule backup jobs
  become: true
  ansible.builtin.cron:
    name: "backup-{{ item.name }}"
    job: "flock -n /var/lock/backup-{{ item.name }}.lock /usr/local/sbin/backup-{{ item.name }}.sh"
    minute: "{{ item.schedule.split()[0] }}"
    hour: "{{ item.schedule.split()[1] }}"
    day: "{{ item.schedule.split()[2] }}"
    month: "{{ item.schedule.split()[3] }}"
    weekday: "{{ item.schedule.split()[4] }}"
    state: present
  loop: "{{ backup_jobs }}"
  loop_control:
    label: "{{ item.name }}"
