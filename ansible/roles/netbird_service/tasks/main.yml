---
- name: Create directories
  become: true
  ansible.builtin.file:
    path: "{{ netbird_service_compose_dir }}"
    state: directory
    mode: '0700'

- name: Add configuration files
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ netbird_service_compose_dir }}/{{ item.src | splitext | first }}"
    # The unprivileged server container must read config.yml; the root-only
    # directory still protects it on the host.
    mode: "{{ item.mode }}"
  loop:
    - { src: docker-compose.yml.j2, mode: '0600' }
    - { src: config.yml.j2, mode: '0644' }
    - { src: dashboard.env.j2, mode: '0600' }
  register: _netbird_service_configuration_files

- name: Start container
  when: not ansible_check_mode
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ netbird_service_compose_dir }}"
    state: "present"
    pull: "always"
    recreate: "{{ 'always' if _netbird_service_configuration_files is changed else 'auto' }}"
    remove_orphans: true
