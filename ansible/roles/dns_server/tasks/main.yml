---
- name: Create directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '755'
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
  loop:
    - path: "{{ dns_server_compose_dir }}"

- name: Apply configuration
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '644'
  loop:
    - src: blocky.yml.j2
      dest: "{{ dns_server_compose_dir }}/blocky.yml"
    - src: docker-compose.yml.j2
      dest: "{{ dns_server_compose_dir }}/docker-compose.yml"
  register: _dns_server_configuration_files

- name: Start DNS server
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ dns_server_compose_dir }}"
    state: "present"
    pull: "always"
    recreate: "{{ 'always' if _dns_server_configuration_files is changed else 'auto' }}"
    remove_orphans: true
