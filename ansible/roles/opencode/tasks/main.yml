---
- name: Require a GitHub token
  ansible.builtin.assert:
    that: opencode_github_token | length > 0
    fail_msg: Set vault_opencode.github_token before deploying OpenCode.
    quiet: true

- name: Configure firewall
  ansible.builtin.import_role:
    name: firewall
  vars:
    firewall_rules:
      - chain: DOCKER-USER
        rule: RETURN
        in_interface: "{{ opencode_netbird_interface }}"
        port: "{{ opencode_port }}"
        proto: tcp
        comment: OpenCode over NetBird
      - chain: DOCKER-USER
        rule: DROP
        port: "{{ opencode_port }}"
        proto: tcp
        comment: OpenCode outside NetBird

- name: Create directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
  loop:
    - path: "{{ opencode_compose_dir }}"
      mode: '755'
    - path: "{{ opencode_home_dir }}"
      mode: '700'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"
    - path: "{{ opencode_workspace_dir }}"
      mode: '755'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"

- name: Add environment file
  become: true
  ansible.builtin.template:
    src: env.j2
    dest: "{{ opencode_compose_dir }}/.env"
    mode: '600'
  no_log: true

- name: Check service configuration
  become: true
  ansible.builtin.stat:
    path: "{{ opencode_home_dir }}/.config/opencode/service.json"
  register: _opencode_service_configuration

- name: Seed service configuration
  become: true
  when: not _opencode_service_configuration.stat.exists
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --env
      - "HOME={{ opencode_container_home }}"
      - --volume
      - "{{ opencode_home_dir }}:{{ opencode_container_home }}"
      - "{{ opencode_image }}"
      - service
      - set
      - "{{ item.key }}"
      - "{{ item.value }}"
  loop:
    - key: hostname
      value: 0.0.0.0
    - key: port
      value: "{{ opencode_port }}"
  changed_when: true

- name: Add Docker compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ opencode_compose_dir }}/docker-compose.yml"
    mode: '640'

- name: Start OpenCode
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ opencode_compose_dir }}"
    state: "present"
    pull: "always"
    recreate: "auto"
    remove_orphans: true
