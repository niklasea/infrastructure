---
- name: Require a GitHub token
  ansible.builtin.assert:
    that: opencode_github_token | length > 0
    fail_msg: Set vault_opencode.github_token before deploying OpenCode.
    quiet: true

- name: Require a DeepSeek API key
  ansible.builtin.assert:
    that: opencode_deepseek_api_key | length > 0
    fail_msg: Set vault_opencode.deepseek_api_key before deploying OpenCode.
    quiet: true
  when: >-
    opencode_default_model.startswith('deepseek/')
    or opencode_build_model.startswith('deepseek/')
    or opencode_plan_model.startswith('deepseek/')

- name: Ensure Docker is running
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started

- name: Configure firewall
  ansible.builtin.import_role:
    name: firewall
  vars:
    firewall_rules:
      - chain: DOCKER-USER
        rule: RETURN
        src: "{{ opencode_allowed_network }}"
        port: "{{ opencode_port }}"
        proto: tcp
        comment: OpenCode from the overlay network
      - chain: DOCKER-USER
        rule: DROP
        port: "{{ opencode_port }}"
        proto: tcp
        comment: OpenCode from outside the overlay network

- name: Create directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
  loop:
    - path: "{{ opencode_compose_dir }}"
      mode: '755'
    - path: "{{ opencode_home_dir }}"
      mode: '700'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"
    - path: "{{ opencode_workspace_dir }}"
      mode: '700'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"
    - path: "{{ opencode_home_dir }}/.config/opencode"
      mode: '700'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"

- name: Add OpenCode configuration
  become: true
  ansible.builtin.template:
    src: opencode.json.j2
    dest: "{{ opencode_home_dir }}/.config/opencode/opencode.json"
    mode: '600'
    owner: "{{ docker_remap_user }}"
    group: "{{ docker_remap_user }}"

- name: Add environment file
  become: true
  ansible.builtin.template:
    src: env.j2
    dest: "{{ opencode_compose_dir }}/.env"
    mode: '600'
  no_log: true

- name: Check service configuration
  become: true
  ansible.builtin.stat:
    path: "{{ opencode_home_dir }}/.config/opencode/service.json"
  register: _opencode_service_configuration

- name: Read service configuration
  become: true
  when: _opencode_service_configuration.stat.exists
  ansible.builtin.slurp:
    src: "{{ opencode_home_dir }}/.config/opencode/service.json"
  register: _opencode_service_configuration_content

- name: Pull OpenCode image
  become: true
  ansible.builtin.command:
    cmd: "docker pull {{ opencode_image }}"
  register: _opencode_image_pull
  changed_when: false
  retries: 10
  delay: 30
  until: _opencode_image_pull.rc == 0

- name: Seed service configuration
  become: true
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --env
      - "HOME={{ opencode_container_home }}"
      - --volume
      - "{{ opencode_home_dir }}:{{ opencode_container_home }}"
      - "{{ opencode_image }}"
      - service
      - set
      - "{{ item.key }}"
      - "{{ item.value }}"
  loop:
    - key: hostname
      value: 0.0.0.0
    - key: port
      value: "{{ opencode_port }}"
  loop_control:
    label: "{{ item.key }}"
  when: >-
    not _opencode_service_configuration.stat.exists
    or ((_opencode_service_configuration_content.content | b64decode | from_json)[item.key] | default('')) | string
    != item.value | string
  register: _opencode_service_configuration_seed
  changed_when: true

- name: Add Docker compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ opencode_compose_dir }}/docker-compose.yml"
    mode: '640'

- name: Start OpenCode
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ opencode_compose_dir }}"
    state: "present"
    pull: "always"
    recreate: "{{ 'always' if _opencode_service_configuration_seed is changed else 'auto' }}"
    remove_orphans: true
