---
- name: Require a GitHub token
  ansible.builtin.assert:
    that: opencode_github_token | length > 0
    fail_msg: Set vault_opencode.github_token before deploying OpenCode.
    quiet: true

- name: Validate API key mapping
  ansible.builtin.assert:
    that: opencode_api_keys is mapping
    fail_msg: opencode_api_keys must be a mapping of environment variable names to values.
    quiet: true

- name: Require an allowed network
  ansible.builtin.assert:
    that: opencode_allowed_network | length > 0
    fail_msg: Set opencode_allowed_network to the source network allowed to reach OpenCode.
    quiet: true

- name: Ensure Docker is running
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started

- name: Configure firewall
  ansible.builtin.import_role:
    name: firewall
  vars:
    firewall_rules:
      - chain: DOCKER-USER
        rule: RETURN
        src: "{{ opencode_allowed_network }}"
        port: "{{ opencode_port }}"
        proto: tcp
        comment: OpenCode from the allowed network
      - chain: DOCKER-USER
        rule: DROP
        port: "{{ opencode_port }}"
        proto: tcp
        comment: OpenCode from outside the allowed network

- name: Create the OpenCode compose directory
  become: true
  ansible.builtin.file:
    path: "{{ opencode_compose_dir }}"
    state: directory
    mode: '755'

- name: Create the data filesystem image
  become: true
  ansible.builtin.command:
    cmd: "truncate -s {{ opencode_data_size }} {{ opencode_data_image }}"
    creates: "{{ opencode_data_image }}"
  register: _opencode_data_image_create

- name: Restrict the data image permissions
  become: true
  ansible.builtin.file:
    path: "{{ opencode_data_image }}"
    mode: '0600'

- name: Inspect the data filesystem
  become: true
  ansible.builtin.command:
    cmd: "blkid -o value -s TYPE {{ opencode_data_image }}"
  register: _opencode_data_filesystem
  changed_when: false
  failed_when: false

- name: Check whether the data filesystem is mounted
  become: true
  ansible.builtin.command:
    cmd: "mountpoint -q {{ opencode_data_dir }}"
  register: _opencode_data_mounted
  changed_when: false
  failed_when: false

- name: Format the data filesystem
  become: true
  ansible.builtin.command:
    cmd: "mkfs.ext4 -F -L opencode-data {{ opencode_data_image }}"
  when:
    - _opencode_data_mounted.rc != 0
    - (_opencode_data_image_create is changed) or (_opencode_data_filesystem.stdout | trim != 'ext4')

- name: Create the data mountpoint
  become: true
  ansible.builtin.file:
    path: "{{ opencode_data_dir }}"
    state: directory
    mode: '700'

- name: Mount the data filesystem
  become: true
  ansible.builtin.mount:
    path: "{{ opencode_data_dir }}"
    src: "{{ opencode_data_image }}"
    fstype: ext4
    opts: loop,nosuid,nodev
    state: mounted

- name: Check the data migration marker
  become: true
  ansible.builtin.stat:
    path: "{{ opencode_data_dir }}/.migrated"
  register: _opencode_data_migration

- name: Check the legacy home
  become: true
  ansible.builtin.stat:
    path: "{{ opencode_legacy_home_dir }}"
  register: _opencode_legacy_home

- name: Check the legacy workspace
  become: true
  ansible.builtin.stat:
    path: "{{ opencode_legacy_workspace_dir }}"
  register: _opencode_legacy_workspace

- name: Check the existing compose file
  become: true
  ansible.builtin.stat:
    path: "{{ opencode_compose_dir }}/docker-compose.yml"
  register: _opencode_compose_file

- name: Stop OpenCode for the data migration
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ opencode_compose_dir }}"
    state: stopped
  when:
    - not _opencode_data_migration.stat.exists
    - _opencode_compose_file.stat.exists

- name: Create the data directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '700'
    owner: "{{ docker_remap_user }}"
    group: "{{ docker_remap_user }}"
  loop:
    - "{{ opencode_home_dir }}"
    - "{{ opencode_workspace_dir }}"

- name: Copy the existing home into the data filesystem
  become: true
  ansible.builtin.command:
    cmd: "cp -a {{ opencode_legacy_home_dir }}/. {{ opencode_home_dir }}/"
  when:
    - not _opencode_data_migration.stat.exists
    - _opencode_legacy_home.stat.exists

- name: Copy the existing workspace into the data filesystem
  become: true
  ansible.builtin.command:
    cmd: "cp -a {{ opencode_legacy_workspace_dir }}/. {{ opencode_workspace_dir }}/"
  when:
    - not _opencode_data_migration.stat.exists
    - _opencode_legacy_workspace.stat.exists

- name: Mark the data migration complete
  become: true
  ansible.builtin.file:
    path: "{{ opencode_data_dir }}/.migrated"
    state: touch
    mode: '0600'
  when: not _opencode_data_migration.stat.exists

- name: Create directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
  loop:
    - path: "{{ opencode_compose_dir }}"
      mode: '755'
    - path: "{{ opencode_home_dir }}"
      mode: '700'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"
    - path: "{{ opencode_workspace_dir }}"
      mode: '700'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"
    - path: "{{ opencode_home_dir }}/.config/opencode"
      mode: '700'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"
    - path: "{{ opencode_managed_config_dir }}"
      mode: '755'
    - path: "{{ opencode_skills_source_dir }}"
      mode: '755'

- name: Install skills source
  become: true
  ansible.builtin.git:
    repo: "{{ opencode_skills_repo }}"
    dest: "{{ opencode_skills_source_dir }}"
    version: "{{ opencode_skills_version }}"
    update: true
  register: _opencode_skills_source

- name: Ensure the global instructions mountpoint exists
  become: true
  ansible.builtin.file:
    path: "{{ opencode_home_dir }}/.config/opencode/AGENTS.md"
    state: touch
    mode: '0644'
    owner: "{{ docker_remap_user }}"
    group: "{{ docker_remap_user }}"

- name: Add OpenCode configuration files
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - src: opencode.json.j2
      dest: "{{ opencode_managed_config_dir }}/opencode.json"
      mode: '644'
    - src: env.j2
      dest: "{{ opencode_compose_dir }}/.env"
      mode: '600'
      no_log: true
    - src: docker-compose.yml.j2
      dest: "{{ opencode_compose_dir }}/docker-compose.yml"
      mode: '640'
  loop_control:
    label: "{{ item.dest }}"
  no_log: "{{ item.no_log | default(false) }}"

- name: Check service configuration
  become: true
  ansible.builtin.stat:
    path: "{{ opencode_home_dir }}/.config/opencode/service.json"
  register: _opencode_service_configuration

- name: Read service configuration
  become: true
  when: _opencode_service_configuration.stat.exists
  ansible.builtin.slurp:
    src: "{{ opencode_home_dir }}/.config/opencode/service.json"
  register: _opencode_service_configuration_content
  no_log: true

- name: Read current OpenCode image
  become: true
  community.docker.docker_image_info:
    name:
      - "ghcr.io/niklasea/opencode:{{ opencode_version }}"
  register: _opencode_image_before

# docker_compose_v2_pull with policy=always cannot tell whether the image
# changed, so compare the image ID before and after the pull.
- name: Pull OpenCode image
  become: true
  community.docker.docker_compose_v2_pull:
    project_src: "{{ opencode_compose_dir }}"
    policy: always
  register: _opencode_image_pull
  changed_when: false
  retries: 20
  delay: 30
  until: _opencode_image_pull is success

- name: Detect OpenCode image update
  become: true
  community.docker.docker_image_info:
    name:
      - "ghcr.io/niklasea/opencode:{{ opencode_version }}"
  register: _opencode_image_after
  changed_when: >-
    (_opencode_image_before.images | map(attribute='Id') | list)
    != (_opencode_image_after.images | map(attribute='Id') | list)

- name: Seed service configuration
  become: true
  community.docker.docker_compose_v2_run:
    project_src: "{{ opencode_compose_dir }}"
    service: opencode
    argv:
      - service
      - set
      - "{{ item.key }}"
      - "{{ item.value }}"
    cleanup: true
    interactive: false
  loop:
    - key: hostname
      value: 0.0.0.0
    - key: port
      value: "{{ opencode_port }}"
  loop_control:
    label: "{{ item.key }}"
  when: >-
    not _opencode_service_configuration.stat.exists
    or ((_opencode_service_configuration_content.content | b64decode | from_json)[item.key] | default('')) | string
    != item.value | string
  register: _opencode_service_configuration_seed
  changed_when: true

- name: Start OpenCode
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ opencode_compose_dir }}"
    state: "present"
    pull: "missing"
    recreate: "{{ 'always' if (_opencode_service_configuration_seed is changed or _opencode_skills_source is changed) else 'auto' }}"
    remove_orphans: true
    wait: true
    wait_timeout: 120
