---
- name: Require a GitHub token
  ansible.builtin.assert:
    that: opencode_github_token | length > 0
    fail_msg: Set vault_opencode.github_token before deploying OpenCode.
    quiet: true

- name: Validate API key mapping
  ansible.builtin.assert:
    that: opencode_api_keys is mapping
    fail_msg: opencode_api_keys must be a mapping of environment variable names to values.
    quiet: true

- name: Require a bind address on the overlay network
  ansible.builtin.assert:
    that: opencode_bind_address | length > 0
    fail_msg: Set opencode_bind_address or ensure the overlay network is up before deploying.
    quiet: true

- name: Ensure Docker is running
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started

- name: Configure firewall
  ansible.builtin.import_role:
    name: firewall
  vars:
    firewall_rules:
      - chain: DOCKER-USER
        rule: RETURN
        src: "{{ opencode_allowed_network }}"
        port: "{{ opencode_port }}"
        proto: tcp
        comment: OpenCode from the overlay network
      - chain: DOCKER-USER
        rule: DROP
        port: "{{ opencode_port }}"
        proto: tcp
        comment: OpenCode from outside the overlay network

- name: Create directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
  loop:
    - path: "{{ opencode_compose_dir }}"
      mode: '755'
    - path: "{{ opencode_home_dir }}"
      mode: '700'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"
    - path: "{{ opencode_workspace_dir }}"
      mode: '700'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"
    - path: "{{ opencode_home_dir }}/.config/opencode"
      mode: '700'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"
    - path: "{{ opencode_managed_config_dir }}"
      mode: '755'

- name: Add OpenCode configuration files
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - src: opencode.json.j2
      dest: "{{ opencode_managed_config_dir }}/opencode.json"
      mode: '644'
    - src: env.j2
      dest: "{{ opencode_compose_dir }}/.env"
      mode: '600'
      no_log: true
    - src: docker-compose.yml.j2
      dest: "{{ opencode_compose_dir }}/docker-compose.yml"
      mode: '640'
  loop_control:
    label: "{{ item.dest }}"
  no_log: "{{ item.no_log | default(false) }}"

- name: Check service configuration
  become: true
  ansible.builtin.stat:
    path: "{{ opencode_home_dir }}/.config/opencode/service.json"
  register: _opencode_service_configuration

- name: Read service configuration
  become: true
  when: _opencode_service_configuration.stat.exists
  ansible.builtin.slurp:
    src: "{{ opencode_home_dir }}/.config/opencode/service.json"
  register: _opencode_service_configuration_content
  no_log: true

- name: Pull OpenCode image
  become: true
  community.docker.docker_compose_v2_pull:
    project_src: "{{ opencode_compose_dir }}"
    policy: always
  register: _opencode_image_pull
  changed_when: false
  retries: 10
  delay: 30
  until: _opencode_image_pull is success

- name: Seed service configuration
  become: true
  community.docker.docker_compose_v2_run:
    project_src: "{{ opencode_compose_dir }}"
    service: opencode
    argv:
      - service
      - set
      - "{{ item.key }}"
      - "{{ item.value }}"
    cleanup: true
    interactive: false
  loop:
    - key: hostname
      value: 0.0.0.0
    - key: port
      value: "{{ opencode_port }}"
  loop_control:
    label: "{{ item.key }}"
  when: >-
    not _opencode_service_configuration.stat.exists
    or ((_opencode_service_configuration_content.content | b64decode | from_json)[item.key] | default('')) | string
    != item.value | string
  register: _opencode_service_configuration_seed
  changed_when: true

- name: Start OpenCode
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ opencode_compose_dir }}"
    state: "present"
    pull: "missing"
    recreate: "{{ 'always' if _opencode_service_configuration_seed is changed else 'auto' }}"
    remove_orphans: true
    wait: true
    wait_timeout: 120
