---
immich_compose_dir: "{{ docker_compose_dir }}/immich"
immich_upload_dir: "{{ immich_compose_dir }}/library"
immich_db_data_dir: "{{ immich_compose_dir }}/postgres"

immich_version: v3
immich_port: 8005
immich_timezone: Etc/UTC

immich_db_username: postgres
immich_db_name: immich
# Must be a random password using only A-Za-z0-9 characters.
# immich_db_password:

immich_external_library_paths: []

# Optional SMB mount definition for immich_upload_dir. When unset, the upload
# root is stored on a local directory.
# immich_uploads_smb:

immich_valkey_image: "docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd"
immich_postgres_image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
