---
# https://immich.app/docs/install/docker-compose
- name: Validate database password
  ansible.builtin.assert:
    that:
      - immich_db_password is defined
      - (immich_db_password | default('')) is match('^[A-Za-z0-9]+$')
    fail_msg: "immich_db_password must contain only alphanumeric characters."
    quiet: true

- name: Create application directory
  become: true
  ansible.builtin.file:
    path: "{{ immich_compose_dir }}"
    state: directory
    mode: '755'

- name: Mount upload storage
  ansible.builtin.include_role:
    name: smb_mount
  vars:
    smb_mounts:
      immich_uploads: "{{ immich_uploads_smb }}"

- name: Check upload storage mount
  become: true
  ansible.builtin.command:
    cmd: "mountpoint -q {{ immich_upload_dir }}"
  register: _immich_upload_mount
  changed_when: false
  failed_when: false

- name: Require upload storage mount
  ansible.builtin.assert:
    that:
      - _immich_upload_mount.rc == 0
    fail_msg: "{{ immich_upload_dir }} is not a mount point; refusing to start Immich."
    quiet: true

- name: Create Docker systemd override directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'

- name: Configure Docker mount dependency
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/immich-storage.conf
    mode: '0644'
    content: |
      [Unit]
      RequiresMountsFor={{ immich_upload_dir }}
  register: _immich_docker_mount_dependency

- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: _immich_docker_mount_dependency is changed

# Postgres creates and secures its own data directory. Re-owning an initialised
# database would remove the permissions of the postgres user.
- name: Check database directory
  become: true
  ansible.builtin.stat:
    path: "{{ immich_db_data_dir }}"
  register: _immich_db_data_dir

- name: Create database directory
  become: true
  when: not _immich_db_data_dir.stat.exists
  ansible.builtin.file:
    path: "{{ immich_db_data_dir }}"
    state: directory
    mode: '755'
    owner: "{{ docker_remap_user }}"
    group: "{{ docker_remap_user }}"

- name: Add configuration files
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: docker-compose.yml.j2
      dest: "{{ immich_compose_dir }}/docker-compose.yml"
      mode: '0640'
    - src: env.j2
      dest: "{{ immich_compose_dir }}/.env"
      mode: '0600'
  register: _immich_configuration_files

- name: Add backup script
  become: true
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ immich_compose_dir }}/backup.sh"
    owner: root
    group: root
    mode: '0750'

- name: Start Immich
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ immich_compose_dir }}"
    state: "present"
    pull: "always"
    recreate: "{{ 'always' if _immich_configuration_files is changed else 'auto' }}"
    remove_orphans: true
