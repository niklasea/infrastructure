---
home_assistant_compose_dir: "{{ docker_compose_dir }}/home_assistant"
home_assistant_config_dir: "{{ home_assistant_compose_dir }}/config"

home_assistant_entity_ids:
  door_sensor: binary_sensor.ikea_parasoll_door_window_sensor
  living_room_light: light.ikea_tradfri_bulb_e27_ww_g95_cl_470lm
  work_light: light.work_lamp
  bedside_light: light.bedside_table
  presence: zone.home

home_assistant_water_leak_sensors:
  - binary_sensor.kitchen_ikea_badring_water_leakage_sensor
  - binary_sensor.ikea_badring_water_leakage_sensor

home_assistant_notify:
  email: notify.niklas_home_assistant_niklas
  mobile: notify.sm_s928b

# Device registry ID; changes if the remote is removed and paired again.
home_assistant_styrbar:
  device_id: 086baa3ced1dc43db09e24947c67dda2
  targets:
    - light.ikea_tradfri_bulb_e27_ww_g95_cl_470lm
    - light.work_lamp

home_assistant_battery_devices:
  - name: Living room door sensor
    entity: binary_sensor.ikea_parasoll_door_window_sensor
  - name: Kitchen leak sensor
    entity: binary_sensor.kitchen_ikea_badring_water_leakage_sensor
  - name: Leak sensor
    entity: binary_sensor.ikea_badring_water_leakage_sensor
  - name: STYRBAR remote
    entity: sensor.ikea_remote_control_n2_battery

# Paths relative to files/ or templates/ and the config directory. Blueprint
# sources keep a .blueprint suffix because their !input tags are not valid YAML,
# and .j2 sources are rendered as templates.
home_assistant_config_files:
  - src: blueprints/automation/kiann/styrbar_zha.yaml.blueprint
    dest: blueprints/automation/kiann/styrbar_zha.yaml
  - src: packages/lighting.yaml.j2
    dest: packages/lighting.yaml
  - src: packages/battery.yaml.j2
    dest: packages/battery.yaml
  - src: packages/water.yaml.j2
    dest: packages/water.yaml

home_assistant_version: stable

# Home Assistant is hosted away from the devices it controls. mDNS does not
# cross the site-to-site VPN, so clients must use the Caddy URL and
# integrations need static addresses or a separate mDNS reflector.
#
# Enable these only when the host has local USB or Bluetooth radios.
# Privileged mode is incompatible with the daemon's user namespace remapping.
home_assistant_privileged: false
home_assistant_dbus_enabled: false
home_assistant_devices: []
