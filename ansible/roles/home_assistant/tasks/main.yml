---
- name: Create directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode | default('755') }}"
  loop:
    - path: "{{ home_assistant_compose_dir }}"
    - path: "{{ home_assistant_config_dir }}"
      mode: '700'
      owner: "{{ docker_remap_user }}"
      group: "{{ docker_remap_user }}"

- name: Create config directories
  become: true
  ansible.builtin.file:
    path: "{{ home_assistant_config_dir }}/{{ item }}"
    state: directory
    owner: "{{ docker_remap_user }}"
    group: "{{ docker_remap_user }}"
    mode: '755'
  loop: >-
    {{ home_assistant_config_files
    | map(attribute='dest') | map('dirname') | unique }}

- name: Add config files
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ home_assistant_config_dir }}/{{ item.dest }}"
    owner: "{{ docker_remap_user }}"
    group: "{{ docker_remap_user }}"
    mode: '644'
  loop: "{{ home_assistant_config_files }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Add Docker compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ home_assistant_compose_dir }}/docker-compose.yml"
    mode: '640'

- name: Start Home Assistant
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ home_assistant_compose_dir }}"
    state: "present"
    pull: "always"
    recreate: "auto"
    remove_orphans: true

# Home Assistant writes its default configuration on first start, so the
# packages include can only be added once the container has run.
- name: Wait for Home Assistant configuration
  become: true
  ansible.builtin.wait_for:
    path: "{{ home_assistant_config_dir }}/configuration.yaml"
    timeout: 120

- name: Read Home Assistant configuration
  become: true
  ansible.builtin.slurp:
    src: "{{ home_assistant_config_dir }}/configuration.yaml"
  register: _home_assistant_configuration

- name: Set Home Assistant configuration content
  ansible.builtin.set_fact:
    _home_assistant_configuration_text: >-
      {{ _home_assistant_configuration.content | b64decode }}

- name: Add packages include to existing homeassistant block
  become: true
  ansible.builtin.lineinfile:
    path: "{{ home_assistant_config_dir }}/configuration.yaml"
    insertafter: '^homeassistant:'
    line: '  packages: !include_dir_named packages'
  when:
    - "'packages:' not in _home_assistant_configuration_text"
    - "_home_assistant_configuration_text is search('(?m)^homeassistant:')"
  notify: Restart Home Assistant

- name: Add homeassistant block with packages include
  become: true
  ansible.builtin.blockinfile:
    path: "{{ home_assistant_config_dir }}/configuration.yaml"
    insertafter: EOF
    marker: "# {mark} ANSIBLE MANAGED HOMEASSISTANT"
    block: |
      homeassistant:
        packages: !include_dir_named packages
  when:
    - "'packages:' not in _home_assistant_configuration_text"
    - "_home_assistant_configuration_text is not search('(?m)^homeassistant:')"
  notify: Restart Home Assistant
