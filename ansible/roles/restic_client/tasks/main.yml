---
- name: Validate backup client configuration
  ansible.builtin.assert:
    that:
      - restic_client_jobs | length > 0
      - vault_restic_repo_passwords | default({}) is mapping
      - inventory_hostname_short in (vault_restic_repo_passwords | default({}))
    fail_msg: >-
      Add a vault_restic_repo_passwords entry for {{ inventory_hostname_short }}
      and define at least one restic job.
    quiet: true

- name: Validate backup jobs
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z0-9][a-z0-9-]*$')
      - item.paths is defined
      - item.paths | length > 0
    loop: "{{ restic_client_jobs }}"
    loop_control:
      label: "{{ item.name }}"
    quiet: true

- name: Install backup client packages
  become: true
  ansible.builtin.package:
    name:
      - bzip2
      - curl
      - sqlite3
    state: present
  when: not ansible_check_mode

- name: Check installed restic version
  ansible.builtin.command:
    cmd: /usr/local/bin/restic version
  register: _restic_client_version
  changed_when: false
  failed_when: false

- name: Download restic
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/restic/restic/releases/download/v{{ restic_client_version }}/restic_{{ restic_client_version }}_linux_amd64.bz2"
    dest: "/tmp/restic_{{ restic_client_version }}_linux_amd64.bz2"
    checksum: "sha256:{{ restic_client_sha256 }}"
    mode: '0644'
  when:
    - not ansible_check_mode
    - _restic_client_version.rc != 0 or restic_client_version not in _restic_client_version.stdout

- name: Install restic
  become: true
  ansible.builtin.shell:
    cmd: "bzip2 -dc /tmp/restic_{{ restic_client_version }}_linux_amd64.bz2 > /usr/local/bin/restic"
  when:
    - not ansible_check_mode
    - _restic_client_version.rc != 0 or restic_client_version not in _restic_client_version.stdout
  changed_when: true

- name: Set restic permissions
  become: true
  ansible.builtin.file:
    path: /usr/local/bin/restic
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode

- name: Create backup client directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ restic_client_config_dir }}", mode: '0700' }
    - { path: "{{ restic_client_cache_dir }}", mode: '0700' }
    - { path: "{{ restic_client_staging_dir }}", mode: '0700' }
    - { path: "{{ restic_client_job_dir }}", mode: '0700' }

- name: Write repository password
  become: true
  ansible.builtin.copy:
    content: "{{ vault_restic_repo_passwords[inventory_hostname_short] }}\n"
    dest: "{{ restic_client_password_file }}"
    owner: root
    group: root
    mode: '0400'
  no_log: true

- name: Write exclude patterns
  become: true
  ansible.builtin.copy:
    content: "{{ restic_client_excludes | join('\n') }}\n"
    dest: "{{ restic_client_excludes_file }}"
    owner: root
    group: root
    mode: '0644'

- name: Install backup job scripts
  become: true
  ansible.builtin.template:
    src: backup-job.sh.j2
    dest: "{{ restic_client_job_dir }}/{{ item.name }}.sh"
    owner: root
    group: root
    mode: '0700'
  loop: "{{ restic_client_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Install backup job services
  become: true
  ansible.builtin.template:
    src: backup-job.service.j2
    dest: "/etc/systemd/system/restic-backup-{{ item.name }}.service"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ restic_client_jobs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install backup job timers
  become: true
  ansible.builtin.template:
    src: backup-job.timer.j2
    dest: "/etc/systemd/system/restic-backup-{{ item.name }}.timer"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ restic_client_jobs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: not ansible_check_mode

- name: Enable backup job timers
  become: true
  ansible.builtin.systemd:
    name: "restic-backup-{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ restic_client_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Remove legacy backup cron jobs
  become: true
  ansible.builtin.cron:
    name: "{{ item }}"
    state: absent
  loop: "{{ restic_client_legacy_cron_jobs }}"
