---
- name: Set IPv4 iptables rules
  become: true
  ansible.builtin.iptables:
    ip_version: ipv4
    table: "{{ item.table | default(omit) }}"
    chain: "{{ item.chain | default('INPUT') }}"
    jump: "{{ item.rule | default('ACCEPT') }}"
    ctstate: "{{ item.ctstate | default(omit) }}"
    source: "{{ item.src | default(omit) }}"
    in_interface: "{{ item.in_interface | default(omit) }}"
    destination: "{{ item.dest | default(omit) }}"
    destination_port: "{{ item.port | default(omit) }}"
    icmp_type: "{{ item.icmp_type | default(omit) }}"
    protocol: "{{ item.proto | default(omit) }}"
    limit: "{{ item.limit | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ firewall_rules_all }}"

- name: Set IPv4 iptables default policies
  become: true
  ansible.builtin.iptables:
    ip_version: ipv4
    chain: "{{ item.chain | default('INPUT') }}"
    policy: "{{ item.policy }}"
  when: firewall_policies is defined
  loop: "{{ firewall_policies }}"

- tags: firewall_reset_all
  block:
    # Docker owns the raw, mangle and nat tables and the DOCKER* chains in the
    # filter table. Persisting them resurrects stale per-container rules after
    # bridges are recreated (e.g. Docker 28's raw-table drop rules), which
    # silently breaks container-to-container traffic. Keep only user rules.
    # DOCKER-USER is the sanctioned extension point and Docker never writes to
    # it, so it is retained together with the FORWARD jump into it.
    - name: (Debian) Get user-managed IPv4 iptables rules
      become: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          iptables-save -t filter | awk '
            /^:DOCKER-USER /                { print; next }
            /^:DOCKER/                      { next }
            /^-A DOCKER-USER /              { print; next }
            /-j DOCKER-USER([[:space:]]|$)/ { print; next }
            /-j DOCKER/                     { next }
            /^-A DOCKER/                    { next }
            { print }
          '
        executable: /bin/bash
      register: firewall_iptables_save
      changed_when: false
      check_mode: false

    - name: (Debian) Validate IPv4 iptables rules
      become: true
      ansible.builtin.command:
        cmd: iptables-restore --test
        stdin: "{{ firewall_iptables_save.stdout }}"
      changed_when: false
      check_mode: false

    - name: (Debian) Create iptables conf dir
      become: true
      ansible.builtin.file:
        path: /etc/iptables
        state: directory
        mode: '755'

    - name: (Debian) Save IPv4 iptables rules
      become: true
      ansible.builtin.copy:
        content: "{{ firewall_iptables_save.stdout }}\n"
        dest: /etc/iptables/rules.v4
        mode: '644'
      # iptables-save output includes a timestamp, not idempotent
      changed_when: false
