---
- name: Set IPv6 iptables rules
  become: true
  ansible.builtin.iptables:
    ip_version: ipv6
    table: "{{ item.table | default(omit) }}"
    chain: "{{ item.chain | default('INPUT') }}"
    jump: "{{ item.rule | default('ACCEPT') }}"
    ctstate: "{{ item.ctstate | default(omit) }}"
    source: "{{ item.src | default(omit) }}"
    in_interface: "{{ item.in_interface | default(omit) }}"
    destination: "{{ item.dest | default(omit) }}"
    destination_port: "{{ item.port | default(omit) }}"
    icmp_type: "{{ item.icmp_type | default(omit) }}"
    protocol: "{{ item.proto | default(omit) }}"
    limit: "{{ item.limit | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ firewall_rules_ipv6_all }}"

- name: Set IPv6 iptables default policies
  become: true
  ansible.builtin.iptables:
    ip_version: ipv6
    chain: "{{ item.chain | default('INPUT') }}"
    policy: "{{ item.policy }}"
  when: firewall_policies is defined
  loop: "{{ firewall_policies }}"

- tags: firewall_reset_all
  block:
    # See iptables.yml: persist only user-managed rules, never Docker's raw,
    # mangle or nat state.
    - name: (Debian) Get user-managed IPv6 iptables rules
      become: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ip6tables-save -t filter | awk '
            /^#/                            { next }
            /^:DOCKER-USER /                { sub(/\[[0-9]+:[0-9]+\]$/, "[0:0]"); print; next }
            /^:DOCKER/                      { next }
            /^-A DOCKER-USER /              { print; next }
            /-j DOCKER-USER([[:space:]]|$)/ { print; next }
            /-j DOCKER/                     { next }
            /^-A DOCKER/                    { next }
            /^:/                            { sub(/\[[0-9]+:[0-9]+\]$/, "[0:0]") }
            { print }
          '
        executable: /bin/bash
      register: firewall_ip6tables_save
      changed_when: false
      check_mode: false

    - name: (Debian) Validate IPv6 iptables rules
      become: true
      ansible.builtin.command:
        cmd: ip6tables-restore -w 5 --test
        stdin: "{{ firewall_ip6tables_save.stdout }}"
      changed_when: false
      check_mode: false

    - name: (Debian) Create iptables conf dir
      become: true
      ansible.builtin.file:
        path: /etc/iptables
        state: directory
        mode: '755'

    - name: (Debian) Save IPv6 iptables rules
      become: true
      ansible.builtin.copy:
        content: "{{ firewall_ip6tables_save.stdout }}\n"
        dest: /etc/iptables/rules.v6
        mode: '644'
      # The snapshot also captures rules other services add at runtime, so their
      # churn would otherwise report as a role change.
      changed_when: false
