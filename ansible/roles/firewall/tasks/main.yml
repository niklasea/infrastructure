---
# Only the filter table is persisted, so a rule in another table would be
# applied live and then silently lost on reboot.
- name: Validate firewall rule tables
  ansible.builtin.assert:
    that:
      - (item.table | default('filter')) == 'filter'
    fail_msg: "Only filter-table rules are persisted; other tables would vanish on reboot."
    quiet: true
  loop: "{{ firewall_rules_all + firewall_rules_ipv6_all }}"
  tags: firewall_reset_all

- name: Configure chosen IPv4 firewall
  ansible.builtin.include_tasks: iptables.yml
  tags: firewall_reset_all

- name: Configure chosen IPv6 firewall
  ansible.builtin.include_tasks: ip6tables.yml
  tags: firewall_reset_all

- name: (Debian) Gather service facts
  become: true
  ansible.builtin.service_facts:
  tags: firewall_reset_all

# Docker recreates its own rules on startup, so persistence only ever needs to
# restore the user rules saved above. netfilter-persistent is ordered before
# docker.service, which keeps that restore off Docker's live filter table.
- name: (Debian) Ensure iptables persistence is enabled
  become: true
  ansible.builtin.systemd_service:
    name: netfilter-persistent
    enabled: true
  when: "'netfilter-persistent.service' in ansible_facts.services"
  tags: firewall_reset_all

