---
# IPv6 rules are intentionally separate from the IPv4 rule list because
# source/destination addresses and the ICMP protocol differ between families.
firewall_rules_ipv6: []

firewall_rules_ipv6_default:
  - chain: INPUT
    rule: ACCEPT
    ctstate: [ESTABLISHED, RELATED]
    comment: Established and related connections
  - chain: INPUT
    rule: ACCEPT
    in_interface: lo
    comment: Localhost connections
  - chain: INPUT
    rule: ACCEPT
    proto: ipv6-icmp
    comment: IPv6 ICMP
  - chain: INPUT
    rule: ACCEPT
    port: 22
    proto: tcp
    comment: SSH

firewall_rules_ipv6_all: >-
  {{ firewall_rules_ipv6_default + firewall_rules_ipv6 }}
