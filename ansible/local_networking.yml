#!/usr/bin/env ansible-playbook
---
- name: Create DNS servers if they don't exist
  hosts: localhost
  connection: local
  tasks:
    - ansible.builtin.include_role:
        name: proxmox_vm
      vars:
        proxmox_vm_node: atreides
        proxmox_vm_name: "{{ item }}"
        proxmox_vm_net:
          net0: "virtio={{ infrastructure_hosts[proxmox_vm_name]['hardware_address'] }},bridge=vmbr0,tag=10"
        proxmox_vm_tags:
          - dns_server
      register: _proxmox_vm_dns_servers
      loop:
        - dns01
        - dns02

    - name: Refresh inventory to ensure new instances exist in inventory
      ansible.builtin.meta: refresh_inventory

- name: Configure internal DNS servers
  hosts: dns_server
  tasks:
    - ansible.builtin.include_role:
        name: common
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_policies:
          - { chain: INPUT, policy: DROP }
          - { chain: FORWARD, policy: DROP }
        firewall_rules:
          - { chain: INPUT, rule: ACCEPT, ctstate: [ ESTABLISHED, RELATED ] }
          - { chain: INPUT, rule: ACCEPT, in_interface: lo, comment: Localhost connections }
          - { chain: INPUT, rule: ACCEPT, proto: icmp, comment: Ping requests }
          - { chain: INPUT, rule: ACCEPT, port: 22, proto: tcp, comment: SSH }
          - { chain: INPUT, rule: ACCEPT, src: '10.0.0.0/8', port: 53, proto: tcp, comment: DNS }
          - { chain: INPUT, rule: ACCEPT, src: '10.0.0.0/8', port: 53, proto: udp, comment: DNS }
          - { chain: INPUT, rule: ACCEPT, src: '172.16.0.0/12', port: 53, proto: tcp, comment: DNS }
          - { chain: INPUT, rule: ACCEPT, src: '172.16.0.0/12', port: 53, proto: udp, comment: DNS }
          - { chain: INPUT, rule: ACCEPT, src: '192.168.0.0/16', port: 53, proto: tcp, comment: DNS }
          - { chain: INPUT, rule: ACCEPT, src: '192.168.0.0/16', port: 53, proto: udp, comment: DNS }
    - ansible.builtin.include_role:
        name: dns_server
