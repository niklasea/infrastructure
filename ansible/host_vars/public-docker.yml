---
linuxgsm_servers:
  csgo:
    image_version: csgo
    ports:
      - 27015:27015/tcp
      - 27015:27015/udp
      - 27020:27020/udp
    instance_config: |
      gametype="3"
      gamemode="0"
      tickrate="128"
      fn_parms(){
      parms="-game csgo -usercon -strictportbind -ip 0.0.0.0 -port ${port} +clientport ${clientport} +tv_port ${sourcetvport} +sv_setsteamaccount ${gslt} -tickrate ${tickrate} +map ${defaultmap} +servercfgfile ${servercfg} -maxplayers_override ${maxplayers} +mapgroup ${mapgroup} +game_type ${gametype} +game_mode ${gamemode} +host_workshop_collection ${wscollectionid} +workshop_start_map ${wsstartmap} -authkey ${wsapikey} -nobreakpad"
      }
      gslt="{{ vault_csgo_gslt_token }}"
    game_config:
      path: "serverfiles/csgo/cfg/server.cfg"
      config: |
        hostname "Nino's Dungeon"
        rcon_password "{{ vault_csgo_rcon_password }}"
        sv_password "{{ vault_csgo_server_password | default('0') }}"
        exec gamemode_competitive.cfg
        sv_region 3
        sv_pure 1
        sv_pausable 1
        sv_mincmdrate 128
        sv_minupdaterate 128
        bot_quota 2
        bot_difficulty 3
        mp_warmuptime 60
        mp_warmuptime_allplayers_connected 30
  valheim:
    image_version: vh
    ports:
      - 2456-2458:2456-2458/udp
    instance_config: |
      servername="Hogs World"
      # Minimum password length is 5.
      serverpassword="{{ vault_valheim_server_password }}"

restic_client_jobs:
  - name: linuxgsm
    schedule: "*-*-* 03:30:00"
    paths:
      - "{{ restic_client_staging_dir }}/linuxgsm"
    pre: |
      staging="{{ restic_client_staging_dir }}/linuxgsm"
      rm -rf "${staging}"
      mkdir -p "${staging}"
      for instance in {{ docker_compose_dir }}/linuxgsm/*; do
        [[ -d "${instance}" ]] || continue
        name=$(basename "${instance}")
        mkdir -p "${staging}/${name}"
        cp -a "${instance}/docker-compose.yml" "${staging}/${name}/" 2>/dev/null || true
        for path in \
          "${instance}/data/config-lgsm" \
          "${instance}/data/serverfiles/saves" \
          "${instance}/data/serverfiles/csgo/cfg" \
          "${instance}/data/serverfiles/csgo/addons" \
          "${instance}/data/serverfiles/csgo/maps" \
          "${instance}/data/serverfiles/adminlist.txt" \
          "${instance}/data/serverfiles/bannedlist.txt" \
          "${instance}/data/serverfiles/permittedlist.txt"; do
          if [[ -e "${path}" ]]; then
            rel="${path#${instance}/}"
            mkdir -p "${staging}/${name}/$(dirname "${rel}")"
            cp -a "${path}" "${staging}/${name}/$(dirname "${rel}")/"
          fi
        done
      done
      if [[ -z $(ls -A "${staging}") ]]; then
        echo "No LinuxGSM data found under {{ docker_compose_dir }}/linuxgsm"
        false
      fi
