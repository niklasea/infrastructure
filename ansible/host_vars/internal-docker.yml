---
wireguard_server_keys:
  private: "{{ vault_wireguard_home_keys.private }}"
  public: "{{ vault_wireguard_home_keys.public }}"
wireguard_addresses:
  - "{{ vpn_network_ipv4['network'] | ansible.utils.ipaddr('1') }}"
wireguard_peers:
  orangepizero:
    PublicKey: 'HcqY+vyuCP00we+DWbv0GL5oeupHrhVE7GnAbDKuvn8='
    AllowedIPs: "{{ vpn_network_ipv4['network'] | ansible.utils.ipaddr('2') | ansible.utils.ipaddr('address') }}/32"
  NinosDesktop:
    PublicKey: 'R6/Ec6iMXw/VL5uayuYRWCGKRtNyrR1XZSFeRvczAzU='
    AllowedIPs: "{{ vpn_network_ipv4['network'] | ansible.utils.ipaddr('3') | ansible.utils.ipaddr('address') }}/32"
  NinosPhone:
    PublicKey: 'NX95oJKZjkx7GfmbkkcfFUWeULqGIRsFTGrJj8b5mjo='
    AllowedIPs: "{{ vpn_network_ipv4['network'] | ansible.utils.ipaddr('4') | ansible.utils.ipaddr('address') }}/32"
  NinosLaptop:
    PublicKey: 'MlCw9zQYUYoDkC/HNDvPkp2CsYg5m5zoITKtcIDAbQI='
    AllowedIPs: "{{ vpn_network_ipv4['network'] | ansible.utils.ipaddr('5') | ansible.utils.ipaddr('address') }}/32"
  NinosWorkLaptop:
    PublicKey: '4mjMzPorMHAjNpK29Z3FkcNy5dOKxj4H/V4Ie0csIlo='
    AllowedIPs: "{{ vpn_network_ipv4['network'] | ansible.utils.ipaddr('6') | ansible.utils.ipaddr('address') }}/32"
  AsusSingapore:
    PublicKey: 'ru4nKI499VFdKoS0YMHEZuq5wrgnDBDD3dovsHtDYnU='
    AllowedIPs:
      - "{{ vpn_network_ipv4['network'] | ansible.utils.ipaddr('7') | ansible.utils.ipaddr('address') }}/32"
      - "{{ vpn_network_ipv4['peer_networks'] | join(', ') }}"

smb_mounts:
  media:
    network_path: //harkonnen.{{ local_domain }}/Media
    local_path: "/mnt/media"
    options: '_netdev,dir_mode=0555,file_mode=0444'
    username: "{{ vault_smb_jellyfin_credentials.username }}"
    password: "{{ vault_smb_jellyfin_credentials.password }}"
  camera:
    network_path: //harkonnen.{{ local_domain }}/NiklasCamera
    local_path: "/mnt/niklas/camera"
    options: '_netdev,ro,nosuid,nodev,dir_mode=0555,file_mode=0444'
    username: "{{ vault_smb_immich_credentials.username }}"
    password: "{{ vault_smb_immich_credentials.password }}"

jellyfin_media_dir: "{{ smb_mounts.media.local_path }}"

immich_db_password: "{{ vault_immich.db_password }}"
immich_upload_dir: /mnt/immich
immich_uploads_smb:
  network_path: //harkonnen.{{ local_domain }}/Immich
  local_path: "/mnt/immich"
  docker_dependency: true
  options: "_netdev,rw,nosuid,nodev,uid={{ docker_remap_user }},gid={{ docker_remap_user }},file_mode=0660,dir_mode=0770"
  username: "{{ vault_smb_immich_credentials.username }}"
  password: "{{ vault_smb_immich_credentials.password }}"
immich_external_library_paths:
  - "{{ smb_mounts.camera.local_path }}"

vaultwarden_signups_allowed: false
vaultwarden_admin_token: "{{ vault_vaultwarden.admin_token }}"
vaultwarden_domain: "https://bitwarden.{{ local_domain }}"
vaultwarden_smtp:
  host: "{{ vault_vaultwarden.smtp.host }}"
  from: "{{ vault_vaultwarden.smtp.username }}"
  credentials:
    username: "{{ vault_vaultwarden.smtp.username }}"
    password: "{{ vault_vaultwarden.smtp.password }}"

inadyn_period: 600
inadyn_ddns_configurations:
  provider:
    - default@cloudflare.com:
        username: "{{ vault_home_domain }}"
        password: "{{ vault_cloudflare.zone_key }}"
        hostname: "{{ vault_home_domain }}"


caddy_blocks:
  - |
    bitwarden.{{ local_domain }} {
      tls {
          dns cloudflare {{ caddy_cloudflare_api_token }}
          resolvers 1.1.1.1 1.0.0.1
      }

      reverse_proxy 127.0.0.1:8000
    }

    jellyfin.{{ local_domain }} {
      tls {
          dns cloudflare {{ caddy_cloudflare_api_token }}
          resolvers 1.1.1.1 1.0.0.1
      }

      reverse_proxy 127.0.0.1:8001
    }

    omada.{{ local_domain }} {
      tls {
          dns cloudflare {{ caddy_cloudflare_api_token }}
          resolvers 1.1.1.1 1.0.0.1
      }

      reverse_proxy https://127.0.0.1:8002 {
          transport http {
              tls_insecure_skip_verify
          }
      }
    }

    gitea.{{ local_domain }} {
      tls {
          dns cloudflare {{ caddy_cloudflare_api_token }}
          resolvers 1.1.1.1 1.0.0.1
      }

      reverse_proxy 127.0.0.1:8003
    }

    homeassistant.{{ local_domain }} {
      tls {
          dns cloudflare {{ caddy_cloudflare_api_token }}
          resolvers 1.1.1.1 1.0.0.1
      }

      # Home Assistant rejects X-Forwarded-For from an untrusted proxy, and its
      # HTTP settings are UI-managed. Strip the header until Trust X-Forwarded-For
      # is enabled and the Docker bridge gateway is added as a trusted proxy.
      reverse_proxy 127.0.0.1:8123 {
          header_up -X-Forwarded-For
      }
    }

    immich.{{ local_domain }} {
      tls {
          dns cloudflare {{ caddy_cloudflare_api_token }}
          resolvers 1.1.1.1 1.0.0.1
      }
      reverse_proxy 127.0.0.1:8005
    }

    speedtest.{{ local_domain }} {
      tls {
          dns cloudflare {{ caddy_cloudflare_api_token }}
          resolvers 1.1.1.1 1.0.0.1
      }

      reverse_proxy 127.0.0.1:8004
    }

restic_client_jobs:
  - name: compose
    schedule: "*-*-* 02:00:00"
    paths:
      - "{{ docker_compose_dir }}"
    exclude:
      - "{{ docker_compose_dir }}/gitea/data"
      - "{{ docker_compose_dir }}/vaultwarden/data"
      - "{{ docker_compose_dir }}/vaultwarden/web-vault"
      - "{{ docker_compose_dir }}/home_assistant/config"
      - "{{ docker_compose_dir }}/jellyfin/config"
      - "{{ docker_compose_dir }}/immich/library"
      - "{{ docker_compose_dir }}/immich/postgres"

  - name: gitea
    schedule: "*-*-* 02:15:00"
    paths:
      - "{{ restic_client_staging_dir }}/gitea"
    pre: |
      staging="{{ restic_client_staging_dir }}/gitea"
      compose="{{ docker_compose_dir }}/gitea/docker-compose.yml"
      rm -rf "${staging}"
      mkdir -p "${staging}"
      docker compose -f "${compose}" exec -T gitea \
        gitea dump -c /data/gitea/conf/app.ini --type tar.gz -f /tmp/gitea-dump.tar.gz
      docker compose -f "${compose}" cp \
        gitea:/tmp/gitea-dump.tar.gz "${staging}/gitea-dump.tar.gz"
      docker compose -f "${compose}" exec -T gitea rm -f /tmp/gitea-dump.tar.gz

  - name: vaultwarden
    schedule: "*-*-* 02:30:00"
    paths:
      - "{{ restic_client_staging_dir }}/vaultwarden"
      - "{{ docker_compose_dir }}/vaultwarden/data"
    exclude:
      - "{{ docker_compose_dir }}/vaultwarden/data/db.sqlite3*"
      - "{{ docker_compose_dir }}/vaultwarden/data/backup.sqlite3"
    pre: |
      staging="{{ restic_client_staging_dir }}/vaultwarden"
      rm -rf "${staging}"
      mkdir -p "${staging}"
      sqlite3 "{{ docker_compose_dir }}/vaultwarden/data/db.sqlite3" \
        ".backup '${staging}/db.sqlite3'"

  - name: home-assistant
    schedule: "*-*-* 02:45:00"
    paths:
      - "{{ restic_client_staging_dir }}/home-assistant"
      - "{{ docker_compose_dir }}/home_assistant/config"
    exclude:
      - "{{ docker_compose_dir }}/home_assistant/config/home-assistant_v2.db*"
      - "{{ docker_compose_dir }}/home_assistant/config/home-assistant.log*"
      - "{{ docker_compose_dir }}/home_assistant/config/deps"
      - "{{ docker_compose_dir }}/home_assistant/config/tts"
      - "{{ docker_compose_dir }}/home_assistant/config/tmp"
      - "{{ docker_compose_dir }}/home_assistant/config/backups"
      - "{{ docker_compose_dir }}/home_assistant/config/.cache"
    pre: |
      staging="{{ restic_client_staging_dir }}/home-assistant"
      config="{{ docker_compose_dir }}/home_assistant/config"
      rm -rf "${staging}"
      mkdir -p "${staging}"
      if [[ -f "${config}/home-assistant_v2.db" ]]; then
        sqlite3 "${config}/home-assistant_v2.db" ".backup '${staging}/home-assistant_v2.db'"
      fi

  - name: jellyfin
    schedule: "*-*-* 03:00:00"
    paths:
      - "{{ restic_client_staging_dir }}/jellyfin"
      - "{{ docker_compose_dir }}/jellyfin/config"
    exclude:
      - "{{ docker_compose_dir }}/jellyfin/config/cache"
      - "{{ docker_compose_dir }}/jellyfin/config/transcodes"
      - "{{ docker_compose_dir }}/jellyfin/config/log"
      - "{{ docker_compose_dir }}/jellyfin/config/data/jellyfin.db*"
      - "{{ docker_compose_dir }}/jellyfin/config/data/library.db*"
    pre: |
      staging="{{ restic_client_staging_dir }}/jellyfin"
      config="{{ docker_compose_dir }}/jellyfin/config"
      rm -rf "${staging}"
      mkdir -p "${staging}"
      for database in jellyfin.db library.db; do
        if [[ -f "${config}/data/${database}" ]]; then
          sqlite3 "${config}/data/${database}" ".backup '${staging}/${database}'"
        fi
      done

  - name: immich
    schedule: "*-*-* 03:15:00"
    paths:
      - "{{ restic_client_staging_dir }}/immich"
    pre: |
      staging="{{ restic_client_staging_dir }}/immich"
      compose="{{ docker_compose_dir }}/immich/docker-compose.yml"
      rm -rf "${staging}"
      mkdir -p "${staging}"
      docker compose -f "${compose}" exec -T database \
        pg_dump --clean --if-exists --dbname=immich --username=postgres \
        > "${staging}/immich-db.sql"

restic_client_legacy_cron_jobs:
  - Back up Jellyfin to network drive
  - Back up Gitea to network drive
  - Back up vaultwarden to network drive
  - Back up Immich to network drive
  - Back up Home Assistant to network drive
  - Dump vaultwarden sqlite3 database to backup file
