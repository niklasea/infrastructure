---
wireguard_compose_dir: "{{ docker_compose_dir }}/wireguard-dns"
wireguard_interface_name: wg0
wireguard_addresses:
  - "{{ dns_tunnel_sg_address }}"
wireguard_listenport: 51820
wireguard_server_keys:
  private: "{{ vault_wireguard_sin_keys.private }}"
  public: "{{ vault_wireguard_sin_keys.public }}"
# The Singapore router's private key stays on the router; only its public key
# is stored here.
wireguard_peers:
  AsusSingaporeDns:
    PublicKey: "{{ vault_wireguard_sin_router_public_key }}"
    AllowedIPs: "{{ dns_tunnel_router_address }}"

dns_server_listen_addresses: >-
  {{ [ansible_facts['all_ipv4_addresses']
     | ansible.utils.ipaddr('100.64.0.0/10')
     | first,
     dns_tunnel_sg_address | ansible.utils.ipaddr('address')] }}
# blocky cannot bind the tunnel address until the WireGuard interface exists.
dns_server_wait_interfaces:
  - wg0
