---
- name: Set up Netbird management server
  hosts: netbird # Only one primary server
  tasks:
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_rules:
          - { chain: INPUT, rule: ACCEPT, port: 443, proto: tcp, comment: HTTPS }
          - { chain: INPUT, rule: ACCEPT, port: 80, proto: tcp, comment: HTTP }
    - ansible.builtin.import_role:
        name: inadyn
    - ansible.builtin.import_role:
        name: netbird_service
  post_tasks:
    - name: Schedule backup to network drive
      become: true
      ansible.builtin.cron:
        name: "{{ item.name}}"
        job: "{{ item.job }}"
        hour: 4
        minute: 0
        state: present
      loop:
        - name: "Back up netbird to network drive"
          job: |
            docker compose -f {{ netbird_service_compose_dir }} down
            docker compose -f {{ netbird_service_compose_dir }} cp -a netbird-server:/var/lib/netbird/ {{ smb_mounts.backup_netbird.local_path }}
            docker compose -f {{ netbird_service_compose_dir }} up -d

