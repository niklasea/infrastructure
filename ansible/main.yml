#!/usr/bin/env ansible-playbook
---
# TODO: Monitoring and alerts on everything
# TODO: Email server with SMTP relay (Mailgun/SendGrid)

- name: Configure local networking
  ansible.builtin.import_playbook: local_networking.yml

- name: Common settings
  hosts: all,!vyos,!localhost
  tasks:
    - ansible.builtin.import_role:
        name: common
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_policies:
          - { chain: INPUT, policy: DROP }
          - { chain: FORWARD, policy: DROP }
    - ansible.builtin.import_role:
        name: smb_mount

- name: Configure overlay networking
  ansible.builtin.import_playbook: overlay_networking.yml

- name: Internal docker server
  hosts: internal-docker
  tasks:
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_rules:
          - { chain: INPUT, rule: ACCEPT, port: 443, proto: tcp, comment: HTTPS }
          - { chain: INPUT, rule: ACCEPT, port: 80, proto: tcp, comment: HTTP }
        firewall_rules_ipv6:
          - { chain: INPUT, rule: ACCEPT, port: 443, proto: tcp, comment: HTTPS }
          - { chain: INPUT, rule: ACCEPT, port: 80, proto: tcp, comment: HTTP }
    - ansible.builtin.import_role:
        name: caddy
    - ansible.builtin.import_role:
        name: wireguard
    - ansible.builtin.import_role:
        name: inadyn
    - ansible.builtin.import_role:
        name: jellyfin
    - ansible.builtin.import_role:
        name: gitea
    - ansible.builtin.import_role:
        name: vaultwarden
    - ansible.builtin.import_role:
        name: speedtest
    - ansible.builtin.import_role:
        name: omada
  post_tasks:
    - name: Install sqlite for vaultwarden backup
      become: true
      ansible.builtin.package:
        name: sqlite3
        state: present

    - name: Configure backups
      ansible.builtin.import_role:
        name: backup
      vars:
        backup_jobs:
          - name: jellyfin
            mount: "{{ smb_mounts.backup_jellyfin.local_path }}"
            schedule: "0 4 * * *"
            commands:
              - >-
                /usr/bin/tar -zcf
                "{{ smb_mounts.backup_jellyfin.local_path }}/jellyfin.tar.gz.tmp"
                "{{ jellyfin_config_dir }}"
              - >-
                /usr/bin/test -s
                "{{ smb_mounts.backup_jellyfin.local_path }}/jellyfin.tar.gz.tmp"
              - >-
                /usr/bin/tar -tzf
                "{{ smb_mounts.backup_jellyfin.local_path }}/jellyfin.tar.gz.tmp"
                > /dev/null
              - >-
                /usr/bin/mv -f
                "{{ smb_mounts.backup_jellyfin.local_path }}/jellyfin.tar.gz.tmp"
                "{{ smb_mounts.backup_jellyfin.local_path }}/jellyfin.tar.gz"
            cleanup:
              - >-
                /usr/bin/rm -f
                "{{ smb_mounts.backup_jellyfin.local_path }}/jellyfin.tar.gz.tmp"
          - name: gitea
            mount: "{{ smb_mounts.backup_gitea.local_path }}"
            schedule: "15 4 * * *"
            commands:
              - >-
                docker compose -f {{ gitea_compose_dir }}/docker-compose.yml
                exec -T gitea gitea dump
                -c /data/gitea/conf/app.ini
                -f -
                > "{{ smb_mounts.backup_gitea.local_path }}/gitea-dump.zip.tmp"
              - >-
                /usr/bin/test -s
                "{{ smb_mounts.backup_gitea.local_path }}/gitea-dump.zip.tmp"
              - >-
                /usr/bin/python3 -m zipfile -t
                "{{ smb_mounts.backup_gitea.local_path }}/gitea-dump.zip.tmp"
              - >-
                /usr/bin/mv -f
                "{{ smb_mounts.backup_gitea.local_path }}/gitea-dump.zip.tmp"
                "{{ smb_mounts.backup_gitea.local_path }}/gitea-dump.zip"
            cleanup:
              - >-
                /usr/bin/rm -f
                "{{ smb_mounts.backup_gitea.local_path }}/gitea-dump.zip.tmp"
          - name: vaultwarden
            mount: "{{ smb_mounts.backup_vaultwarden.local_path }}"
            schedule: "30 4 * * *"
            commands:
              - >-
                /usr/bin/sqlite3
                "{{ vaultwarden_data_dir }}/db.sqlite3"
                ".backup '${tmpdir}/vaultwarden-db.sqlite3'"
              - >-
                /usr/bin/tar -czf
                "{{ smb_mounts.backup_vaultwarden.local_path }}/data.tar.gz.tmp"
                --exclude='./db.sqlite3'
                --exclude='./db.sqlite3-journal'
                --exclude='./db.sqlite3-wal'
                --exclude='./db.sqlite3-shm'
                --exclude='./backup.sqlite3'
                -C "${tmpdir}" vaultwarden-db.sqlite3
                -C "{{ vaultwarden_data_dir }}" .
              - >-
                /usr/bin/test -s
                "{{ smb_mounts.backup_vaultwarden.local_path }}/data.tar.gz.tmp"
              - >-
                /usr/bin/tar -tzf
                "{{ smb_mounts.backup_vaultwarden.local_path }}/data.tar.gz.tmp"
                > /dev/null
              - >-
                /usr/bin/mv -f
                "{{ smb_mounts.backup_vaultwarden.local_path }}/data.tar.gz.tmp"
                "{{ smb_mounts.backup_vaultwarden.local_path }}/data.tar.gz"
            cleanup:
              - >-
                /usr/bin/rm -f
                "{{ smb_mounts.backup_vaultwarden.local_path }}/data.tar.gz.tmp"

- name: Configure RetroPie
  hosts: retropie
  tasks:
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_rules:
          - { port: '8080', proto: 'tcp', comment: 'Remote control' }
        firewall_rules_ipv6:
          - { port: '8080', proto: 'tcp', comment: 'Remote control' }
    - ansible.builtin.import_role:
        name: wireguard
