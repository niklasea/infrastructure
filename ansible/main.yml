#!/usr/bin/env ansible-playbook
---
# TODO: Monitoring and alerts on everything
# TODO: Email server with SMTP relay (Mailgun/SendGrid)

- name: Configure local networking
  ansible.builtin.import_playbook: local_networking.yml

- name: Common settings
  hosts: all,!vyos,!localhost
  tasks:
    - ansible.builtin.import_role:
        name: common
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_policies:
          - { chain: INPUT, policy: DROP }
          - { chain: FORWARD, policy: DROP }
    - ansible.builtin.import_role:
        name: smb_mount

- name: Configure overlay networking
  ansible.builtin.import_playbook: overlay_networking.yml

- name: Internal docker server
  hosts: internal-docker
  tasks:
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_rules:
          - { chain: INPUT, rule: ACCEPT, port: 443, proto: tcp, comment: HTTPS }
          - { chain: INPUT, rule: ACCEPT, port: 80, proto: tcp, comment: HTTP }
        firewall_rules_ipv6:
          - { chain: INPUT, rule: ACCEPT, port: 443, proto: tcp, comment: HTTPS }
          - { chain: INPUT, rule: ACCEPT, port: 80, proto: tcp, comment: HTTP }
    - ansible.builtin.import_role:
        name: caddy
    - ansible.builtin.import_role:
        name: wireguard
    - ansible.builtin.import_role:
        name: inadyn
    - ansible.builtin.import_role:
        name: jellyfin
    - ansible.builtin.import_role:
        name: gitea
    - ansible.builtin.import_role:
        name: vaultwarden
    - ansible.builtin.import_role:
        name: speedtest
    - ansible.builtin.import_role:
        name: omada
  post_tasks:
    - name: Install sqlite for vaultwarden backup
      become: true
      ansible.builtin.package:
        name: sqlite3
        state: present

    - name: Configure backups
      ansible.builtin.import_role:
        name: backup
      vars:
        backup_jobs:
          - name: jellyfin
            mount: "{{ smb_mounts.backup_jellyfin.local_path }}"
            schedule: "0 4 * * *"
            source: "{{ jellyfin_config_dir }}"
            target: jellyfin.tar.gz
          - name: gitea
            mount: "{{ smb_mounts.backup_gitea.local_path }}"
            schedule: "15 4 * * *"
            pre:
              - >-
                docker compose -f {{ gitea_compose_dir }}/docker-compose.yml
                exec -T gitea gitea dump
                -c /data/gitea/conf/app.ini
                -f - > "${tmpdir}/gitea-dump.zip"
            source: "${tmpdir}/gitea-dump.zip"
            target: gitea-dump.zip
          - name: vaultwarden
            mount: "{{ smb_mounts.backup_vaultwarden.local_path }}"
            schedule: "30 4 * * *"
            pre:
              - >-
                /usr/bin/cp -al "{{ vaultwarden_data_dir }}/." "${tmpdir}/" 2>/dev/null
                || /usr/bin/cp -a "{{ vaultwarden_data_dir }}/." "${tmpdir}/"
              - >-
                /usr/bin/rm -f "${tmpdir}/db.sqlite3"
                "${tmpdir}/db.sqlite3-journal"
                "${tmpdir}/db.sqlite3-wal"
                "${tmpdir}/db.sqlite3-shm"
                "${tmpdir}/backup.sqlite3"
              - >-
                /usr/bin/sqlite3 "{{ vaultwarden_data_dir }}/db.sqlite3"
                ".backup '${tmpdir}/db.sqlite3'"
            source: "${tmpdir}"
            target: data.tar.gz

- name: Configure RetroPie
  hosts: retropie
  tasks:
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_rules:
          - { port: '8080', proto: 'tcp', comment: 'Remote control' }
        firewall_rules_ipv6:
          - { port: '8080', proto: 'tcp', comment: 'Remote control' }
    - ansible.builtin.import_role:
        name: wireguard
