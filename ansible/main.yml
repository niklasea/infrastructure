#!/usr/bin/env ansible-playbook
---
# TODO: Monitoring and alerts on everything
# TODO: Email server with SMTP relay (Mailgun/SendGrid)

- name: Configure local networking
  ansible.builtin.import_playbook: local_networking.yml

- name: Common settings
  hosts: all,!vyos,!localhost
  tasks:
    - ansible.builtin.import_role:
        name: common
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_policies:
          - { chain: INPUT, policy: DROP }
          - { chain: FORWARD, policy: DROP }
    - ansible.builtin.import_role:
        name: smb_mount

- name: Backup server
  hosts: role_backup
  tasks:
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_rules:
          - { chain: INPUT, rule: ACCEPT, src: "{{ internal_network_ipv4 }}", port: 443, proto: tcp, comment: Backup HTTPS from internal network }
          - { chain: INPUT, rule: ACCEPT, src: "{{ infrastructure_hosts['public-docker']['ipv4_address'] }}", port: 443, proto: tcp, comment: Backup HTTPS from public docker }
          - { chain: INPUT, rule: ACCEPT, src: "{{ internal_network_ipv4 }}", port: 80, proto: tcp, comment: Backup HTTP from internal network }
    - ansible.builtin.import_role:
        name: docker
    - ansible.builtin.import_role:
        name: caddy
    - ansible.builtin.import_role:
        name: restic_server

- name: Configure overlay networking
  ansible.builtin.import_playbook: overlay_networking.yml

- name: Internal docker server
  hosts: internal-docker
  tasks:
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_rules:
          - { chain: INPUT, rule: ACCEPT, port: 443, proto: tcp, comment: HTTPS }
          - { chain: INPUT, rule: ACCEPT, port: 80, proto: tcp, comment: HTTP }
        firewall_rules_ipv6:
          - { chain: INPUT, rule: ACCEPT, port: 443, proto: tcp, comment: HTTPS }
          - { chain: INPUT, rule: ACCEPT, port: 80, proto: tcp, comment: HTTP }
    - ansible.builtin.import_role:
        name: caddy
    - ansible.builtin.import_role:
        name: wireguard
    - ansible.builtin.import_role:
        name: inadyn
    - ansible.builtin.import_role:
        name: jellyfin
    - ansible.builtin.import_role:
        name: gitea
    - name: Mount Immich upload storage
      ansible.builtin.import_role:
        name: smb_mount
      vars:
        smb_mounts:  # noqa: var-naming[no-role-prefix]
          immich_uploads: "{{ immich_uploads_smb }}"
    - ansible.builtin.import_role:
        name: immich
    - ansible.builtin.import_role:
        name: vaultwarden
    - ansible.builtin.import_role:
        name: speedtest
    - ansible.builtin.import_role:
        name: omada
    - ansible.builtin.import_role:
        name: home_assistant

- name: Backup clients
  hosts: internal-docker,public-docker,netbird,role_dns_server,!hcloud
  tasks:
    - ansible.builtin.import_role:
        name: restic_client

- name: Configure RetroPie
  hosts: retropie
  tasks:
    - ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_rules:
          - { port: '8080', proto: 'tcp', comment: 'Remote control' }
        firewall_rules_ipv6:
          - { port: '8080', proto: 'tcp', comment: 'Remote control' }
    - ansible.builtin.import_role:
        name: wireguard
